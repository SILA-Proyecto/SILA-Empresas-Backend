spring:
  application:
    name: sila

  jackson:
    # El contrato del dashboard usa los nombres de columna de la base (snake_case).
    property-naming-strategy: SNAKE_CASE

  datasource:
    # Por defecto, el Oracle local. En la nube: SILA_DB_URL=jdbc:oracle:thin:@<servicio>?TNS_ADMIN=<carpeta del wallet> (la pone arrancar.sh
    # desde empresas/<ESQUEMA>/instancia.env; ver sql/LEEME.md, seccion Nube).
    url: ${SILA_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    # Cuenta, clave y esquema salen de variables (./arrancar.sh las carga de credenciales.txt); sin valor por defecto.
    username: ${SILA_DB_USUARIO}
    password: ${SILA_DB_CLAVE}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # La cuenta de la aplicacion no es duena de nada: esto solo resuelve los nombres de
      # los packages y vistas. No otorga ningun privilegio.
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA = ${SILA_DB_ESQUEMA}
      # Los procedimientos PL/SQL hacen su propio COMMIT: no usar @Transactional.
      auto-commit: true
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      # Conexiones recicladas antes de que un firewall/proxy las corte; aviso si una se queda tomada mas de 30 s.
      max-lifetime: 1500000      # 25 min
      keepalive-time: 300000       # 5 min
      leak-detection-threshold: 30000
      pool-name: sila-pool

  # Dos hilos para las tareas programadas: la subida a Drive (lenta) no debe frenar el reintento de PDF.
  task:
    scheduling:
      pool:
        size: 2

  lifecycle:
    timeout-per-shutdown-phase: 30s

  servlet:
    multipart:
      # Archivos subidos por el ADMIN: 10 MB de contenido (el cifrado de Drive agrega ~65 bytes, de ahi los 11 MB).
      max-file-size: 11MB
      max-request-size: 12MB

server:
  # Al apagar, termina las peticiones en curso (hasta 30 s) antes de cerrar.
  shutdown: graceful
  # Solo esta maquina por defecto. Para probar desde otro equipo: SILA_BIND=0.0.0.0 (y nunca en produccion sin proxy y firewall).
  address: ${SILA_BIND:127.0.0.1}
  port: ${SILA_PUERTO:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never   # el detalle de la base no debe verlo cualquiera

logging:
  level:
    com.llanolat.sila: INFO     # para ver el detalle en desarrollo: LOGGING_LEVEL_COM_LLANOLAT_SILA=DEBUG

sila:
  # Los datos de la empresa (nombre, NIT...) y sus modulos salen de la base (tablas empresa y modulos, que cambia solo el
  # dueno con sql/empresa.sh y sql/modulos.sh). Las variables SILA_EMPRESA_* ya no existen. Cache de lectura de la app:
  modulos:
    cache-ttl: ${SILA_MODULOS_CACHE_TTL:30s}
  seguridad:
    # jwt        = identidad del token de acceso. ES EL MODO POR DEFECTO, tambien en desarrollo.
    # desarrollo = la identidad viene de las cabeceras X-Usuario / X-Rol: CUALQUIERA puede
    #              ser ADMIN. Solo por excepcion explicita (SILA_MODO=desarrollo); el arranque
    #              se niega a usarlo con un perfil de produccion.
    modo: ${SILA_MODO:jwt}
    usuario-por-defecto: dev.local
    rol-por-defecto: OPERATIVO
    # Claves en base64, por variable de entorno (./arrancar.sh las carga de credenciales.txt).
    jwt-secret: ${SILA_JWT_SECRET:}
    mfa-key: ${SILA_MFA_KEY:}
    acceso-ttl: 15m
    temporal-ttl: 5m
    refresh-ttl: 12h
    # La cookie de renovacion solo viaja por HTTPS. Chrome y Firefox la aceptan en http://localhost.
    cookie-secure: ${SILA_COOKIE_SECURE:true}
    mfa-obligatorio-roles: ADMIN
  legal:
    # Version VIGENTE de cada documento legal (el texto vive en el dashboard; aqui solo cual rige). Quien no haya aceptado ESTA
    # version de los DOS recibe 403 / 20022 en toda la API salvo /auth, /legal y lo del login. Cambiar la version (y reiniciar)
    # obliga a todos a aceptar de nuevo. Por empresa: SILA_LEGAL_* en empresas/<ESQUEMA>/instancia.env (arrancar.sh las pasa).
    documentos:
      terminos:
        version: ${SILA_LEGAL_TERMINOS_VERSION:1.0}
        fecha: ${SILA_LEGAL_TERMINOS_FECHA:2026-10-28}
      privacidad:
        version: ${SILA_LEGAL_PRIVACIDAD_VERSION:1.0}
        fecha: ${SILA_LEGAL_PRIVACIDAD_FECHA:2026-10-28}
    cache-ttl: ${SILA_LEGAL_CACHE_TTL:30s}
  asistente:
    # Chat de ayuda (flujos de n8n en esta misma maquina). Sin url = apagado. n8n no se expone a internet.
    url: ${SILA_ASISTENTE_URL:}
    secreto: ${SILA_ASISTENTE_SECRETO:}
    # Direccion del API vista DESDE n8n (si n8n corre en Docker, la del anfitrion).
    base-url: ${SILA_ASISTENTE_BASE_URL:http://127.0.0.1:8082/api/v1}
    token-ttl: 5m
    timeout: 60s
    limite-por-hora: 30
  cors:
    # Origenes permitidos (separados por coma). El dashboard de empresas usa http://127.0.0.1:4300 (no localhost: la cookie sila_refresh no distingue puertos; el de Llanolat es localhost:4200).
    origenes: http://127.0.0.1:4300
  archivos:
    # Archivos CIFRADOS (comprobantes en PDF y lo que sube el ADMIN). Fuera de cualquier carpeta que sirva un servidor web.
    directorio: ${SILA_DOCS_DIR:${user.home}/sila_docs}
    # Llave AES-256 (base64, 32 bytes) de los archivos y del acceso a Drive. DISTINTA de SILA_MFA_KEY. Si se pierde, los
    # archivos (tambien los de Drive) no se pueden leer: guardar una copia FUERA del servidor.
    docs-key: ${SILA_DOCS_KEY:}
    # Los movimientos de esta fecha en adelante reciben PDF si les falta (reintento automatico). Vacio = apagado.
    fecha-corte: ${SILA_DOCS_FECHA_CORTE:}
    clamav:
      # Antivirus ClamAV (clamd). Habilitado = la subida se rechaza si clamd no responde. Apagarlo SOLO en desarrollo.
      habilitado: ${SILA_CLAMAV:true}
      host: ${SILA_CLAMAV_HOST:127.0.0.1}
      puerto: ${SILA_CLAMAV_PUERTO:3310}
      socket: ${SILA_CLAMAV_SOCKET:}
    drive:
      client-id: ${SILA_DRIVE_CLIENT_ID:}
      client-secret: ${SILA_DRIVE_CLIENT_SECRET:}
      # Debe coincidir EXACTO con el URI de redireccion registrado en Google Cloud (OAuth, aplicacion web).
      redirect-uri: ${SILA_DRIVE_REDIRECT_URI:}
      # Pagina del dashboard a la que se vuelve al terminar (opcional): se le agrega ?drive=ok o ?drive=error
      retorno: ${SILA_DRIVE_RETORNO:}
